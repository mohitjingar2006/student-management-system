{% extends "base.html" %}

{% block title %}
Update Branch | Student Management System
{% endblock %}

{% block header %}
{% include "students/admin-navbar.html" %}
{% endblock %}

{% block content %}

<div class="center-page">
    <div class="update-branch container">
        <form method="POST" class="form-container">

            <fieldset>
                <legend>Update Information</legend>
                <div class="form-group">
                    <label for="roll-number">Enter Student Roll number</label>
                    <input type="text" id="roll-number" name="roll-number" required>
                </div>
                <div class="form-group">
                    {% include "students/branches.html" %}
                </div>
                <button type="submit" class="success-btn">Submit</button>
            </fieldset>

        </form>
    </div>
</div>

{% endblock %}
